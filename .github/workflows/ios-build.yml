# iPhone app (mobile/) — built in the cloud, because Apple only accepts apps
# built with Xcode 26+ and the owner's laptop can't run it (owner, 11/15/2026).
# Today: proves the app compiles (no signing, nothing sent to Apple).
# Once the Apple Developer account is approved: add signing + upload to
# App Store Connect / TestFlight here.
name: iOS build

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode 26 (App Store minimum)
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install + sync
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Check the built app
        run: |
          APP=$(find build -name "App.app" -path "*Release-iphoneos*" | head -1)
          echo "Built: $APP"
          test -n "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :DTSDKName" "$APP/Info.plist"
