<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launch Call — PMU Bookings On Demand</title>
<link rel="icon" type="image/png" href="/deck/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --teal:#2EC4C6; --teal-dark:#1FA6A8; --teal-soft:#E8F9F9;
  --ink:#171717; --muted:#5b6470; --line:#e6e9ee;
  /* the iPhone system stack — what a real Messages screenshot looks like */
  --ios:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0d1114;color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
/* Slide 7 sets the house style: Inter bold for headings, Poppins for body. */
h1,h2,h3,.disp{font-family:Inter,sans-serif;letter-spacing:-.02em}

/* ---------- fixed 1600x900 stage, scaled to fit ---------- */
#fit{position:fixed;inset:0;overflow:hidden}
/* Absolute + translate, not grid centering: a grid clamps an oversized
   child to the start edge, which pushes the scaled stage off to the right. */
#stage{width:1600px;height:900px;position:absolute;left:50%;top:50%;
  transform-origin:center center;background:#fff;box-shadow:0 0 60px -10px rgba(0,0,0,.6)}
.slide{position:absolute;inset:0;display:none;background:#fff}
.slide.on{display:block}
.slide > .inner{position:absolute;inset:0;padding:52px 70px;display:flex;flex-direction:column}
img.full{width:100%;height:100%;object-fit:cover;display:block}

.brush{position:absolute;top:-34px;left:-64px;width:390px;pointer-events:none;z-index:0}
.logo{position:absolute;top:30px;right:40px;height:52px;z-index:4;opacity:.95}
.slide-no{position:absolute;bottom:20px;left:70px;font-size:11px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:#aab3bd;z-index:6}
.slide-no .lv{color:#ff4d4f}
.slide.dark .slide-no{color:#6d7a84}

.row{position:relative;z-index:2;flex:1;display:flex;gap:56px;align-items:center;min-height:0}
.col-copy{flex:1 1 44%;min-width:0}
.col-visual{flex:1 1 56%;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;gap:30px}

h1.title{font-family:Inter,sans-serif;font-size:55px;line-height:1.1;font-weight:700;margin:0 0 24px}
p.lede{font-family:Poppins,sans-serif;font-size:29px;line-height:1.42;color:#2b3340;margin:0 0 26px;max-width:24em}
p.lede b{font-weight:700}
ul.bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:15px}
ul.bullets li{display:flex;align-items:center;gap:15px;font-family:Poppins,sans-serif;font-size:29px;font-weight:400;line-height:1.42}
ul.bullets.one-line li{white-space:nowrap;font-size:23px}
.chev{flex:none;width:30px;height:30px;border-radius:50%;background:var(--teal);display:grid;place-items:center;
  color:#fff;box-shadow:0 2px 8px rgba(46,196,198,.35)}
.chev svg{width:52%;height:52%}
.rv{opacity:0;transform:translateY(12px)}
.slide.on .rv{animation:rise .55s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.rx{opacity:0;transform:translateX(-14px)}
.slide.on .rx{animation:sx .5s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes sx{to{opacity:1;transform:none}}

/* ---------- phones ---------- */
.phone{position:relative;background:#0d0f12;border-radius:36px;padding:9px;flex:none;
  box-shadow:0 26px 60px -18px rgba(13,15,18,.55),0 0 0 1px rgba(0,0,0,.06)}
.phone .screen{position:relative;background:#fff;border-radius:28px;overflow:hidden;width:100%;height:100%;
  display:flex;flex-direction:column}
.notch{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:33%;height:20px;background:#0d0f12;
  border-radius:0 0 13px 13px;z-index:8}
.statusbar{flex:none;display:flex;justify-content:space-between;align-items:center;padding:8px 15px 3px;
  font-size:10px;font-weight:700;color:#111}
.live{position:absolute;z-index:9;top:12px;left:12px;display:flex;align-items:center;gap:6px;
  background:rgba(17,17,17,.72);color:#fff;border-radius:999px;padding:4px 9px 4px 7px;font-size:9px;
  font-weight:700;letter-spacing:.1em;backdrop-filter:blur(4px)}
.live i{width:6px;height:6px;border-radius:50%;background:#ff4d4f;animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* --- facebook --- */
.ph-fb{width:330px;height:620px}
.fb-chrome{flex:none;padding:0 13px 8px;border-bottom:1px solid #e9ebee}
.fb-top{display:flex;align-items:center;justify-content:space-between}
.fb-word{font-family:Poppins;font-weight:800;color:#0866FF;font-size:18px;letter-spacing:-.03em}
.fb-ic{width:20px;height:20px;border-radius:50%;background:#eef0f3;display:inline-grid;place-items:center;margin-left:6px}
.fb-ic svg{width:58%;height:58%}
.fb-search{margin-top:7px;background:#eef0f3;border-radius:999px;padding:5px 12px;font-size:10px;color:#8a8d91}
.fb-tabs{display:flex;justify-content:space-between;padding:7px 6px 0;color:#8a8d91}
.fb-tabs svg{width:19px;height:19px}
.fb-tabs .act{color:#0866FF}
.post{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.post-head{display:flex;align-items:center;gap:8px;padding:10px 13px 7px}
.avatar{flex:none;width:30px;height:30px;border-radius:50%;overflow:hidden;background:#f2f2f4;display:grid;place-items:center}
.avatar img{width:100%;height:100%;object-fit:cover}
.post-who{min-width:0;flex:1}
.post-name{font-size:12px;font-weight:700;color:#050505;line-height:1.2}
.post-meta{font-size:10px;color:#65676b;display:flex;align-items:center;gap:4px}
.post-more{color:#65676b;font-weight:700;letter-spacing:1px;font-size:13px}
.post-copy{padding:0 13px 8px;font-size:11.5px;line-height:1.38;color:#050505}
.post-copy .more{color:#65676b}
.media{position:relative;flex:1 1 auto;min-height:46%;background:#000}
.media video{width:100%;height:100%;object-fit:cover;display:block}
.fly-wrap{position:absolute;right:10px;bottom:8px;width:64px;height:78%;pointer-events:none;z-index:6}
.fly{position:absolute;right:6px;bottom:4px;width:27px;height:27px;color:#F3425F;opacity:1}
.fly svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.cta-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:7px;background:#f0f2f5;padding:9px 11px}
/* must stay on one line inside the phone */
.cta-bar .hl{display:block;font-size:14px;font-weight:800;color:#050505;line-height:1.25;white-space:nowrap}
.cta-bar .sb{display:block;font-size:10.5px;color:#65676b;margin-top:1px}
.cta-btn{flex:none;background:#e4e6eb;border-radius:6px;font-weight:700;color:#050505;padding:6px 10px;font-size:10px;white-space:nowrap}
.stats{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 13px 6px;
  font-size:12px;color:#65676b;border-bottom:1px solid #e9ebee}
.reacts{display:flex;align-items:center;gap:0}
.rbubble{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;flex:none}
.rbubble svg{width:11px;height:11px;color:#fff}
.rbubble.like{background:linear-gradient(180deg,#3b8cff,#0866FF);z-index:2}
.rbubble.love{background:linear-gradient(180deg,#ff5f7a,#F3425F);margin-left:-6px;z-index:1}
.rcount{margin-left:7px;color:#65676b}
.actions{flex:none;display:flex;justify-content:space-around;padding:7px 0 10px;font-size:11.5px;font-weight:600;color:#65676b}
.actions span{display:flex;align-items:center;gap:5px}
.actions svg{width:14px;height:14px}
.bump{display:inline-block;animation:bump .45s ease-out}
@keyframes bump{0%{transform:translateY(0)}40%{transform:translateY(-3px)}100%{transform:translateY(0)}}

/* --- instagram reel --- */
.ph-ig{width:282px;height:560px;margin-top:40px}
.ig-screen{background:#000}
.ig-reel{position:relative;flex:1;min-height:0;overflow:hidden}
.ig-reel video{width:100%;height:100%;object-fit:cover;display:block}
.ig-shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 46%,rgba(0,0,0,.78) 100%)}
.ig-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
  padding:30px 13px 0;color:#fff;z-index:3}
.ig-top .ttl{font-family:Poppins;font-weight:700;font-size:15px}
.ig-top svg{width:18px;height:18px}
.ig-side{position:absolute;right:9px;bottom:88px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:15px;color:#fff}
.ig-side .it{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:600;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.ig-side svg{width:22px;height:22px}
.ig-disc{width:24px;height:24px;border-radius:6px;overflow:hidden;border:1.5px solid #fff;animation:spin 6s linear infinite}
.ig-disc img{width:100%;height:100%;object-fit:cover}
@keyframes spin{to{transform:rotate(360deg)}}
.ig-bot{position:absolute;left:0;right:52px;bottom:0;z-index:3;color:#fff;padding:0 13px 11px;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.55))}
.ig-user{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.ig-ring{width:26px;height:26px;border-radius:50%;padding:1.5px;
  background:conic-gradient(from 20deg,#f9ce34,#ee2a7b,#6228d7,#f9ce34);flex:none}
.ig-ring i{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;border:1.5px solid #000;background:#fff}
.ig-ring img{width:100%;height:100%;object-fit:cover;display:block}
.ig-user .n{font-size:12px;font-weight:700}
.ig-follow{border:1px solid rgba(255,255,255,.9);border-radius:6px;padding:2px 9px;font-size:10px;font-weight:600}
.ig-cap{font-size:11.5px;line-height:1.35}
.ig-spon{font-size:9.5px;opacity:.92;margin-top:3px;font-weight:600}
.ig-audio{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:9.5px;font-weight:500;overflow:hidden;white-space:nowrap}
.ig-audio svg{width:11px;height:11px;flex:none}
.ig-audio span{display:inline-block;animation:marq 11s linear infinite}
@keyframes marq{0%{transform:translateX(0)}100%{transform:translateX(-52%)}}
.ig-cta{margin-top:8px;background:rgba(255,255,255,.95);color:#111;border-radius:9px;padding:9px;text-align:center;
  font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.ig-cta svg{width:12px;height:12px}
.ig-heart{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#fff;opacity:0;z-index:4}
.ig-heart svg{width:32%;height:32%;filter:drop-shadow(0 4px 14px rgba(0,0,0,.45))}
.ig-heart.pop{animation:hp 1.1s ease-out}
@keyframes hp{0%{opacity:0;transform:scale(.4)}22%{opacity:1;transform:scale(1.12)}40%{transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.ig-prog{position:absolute;left:0;bottom:0;height:2px;background:#fff;z-index:5;width:0;opacity:.9}
/* keep the badge clear of the "Reels" title row */
.ph-ig .live{top:58px}

/* ---------- slide 9: the real funnel survey ---------- */
.ph-survey{width:392px;height:790px}
.ph-survey .notch{display:none}
.fnl{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;font-family:Inter,sans-serif}
.fnl-bar{flex:none;background:var(--teal);color:#fff;text-align:center;font-size:12.5px;font-weight:500;padding:7px}
.fnl-tel{flex:none;text-align:center;font-size:15px;font-weight:700;color:#111;padding:6px;border-bottom:1px solid #eef0f2}
.fnl-brand{flex:none;text-align:center;padding:8px 0 4px}
.fnl-brand img{width:58px;height:58px;border-radius:50%;object-fit:cover;display:inline-block}
.fnl-trust{font-size:12px;color:#6b747f;margin-top:3px}
.fnl-stars{color:#f5a623;font-size:13.5px;letter-spacing:1.5px}
.fnl-cong{flex:none;text-align:center;font-size:15px;color:#111;line-height:1.35;padding:4px 22px 0}
.fnl-h{flex:none;text-align:center;font-family:Poppins;font-weight:700;font-size:23px;line-height:1.2;padding:6px 20px 0}
.fnl-sec{flex:none;text-align:center;font-size:13.5px;color:#6b747f;padding:2px 0 7px}
/* hugs its content, like the real page — not stretched to the phone height */
.fnl-card{flex:0 0 auto;margin:0 16px 16px;background:#fff;border-radius:12px;
  box-shadow:0 3px 18px rgba(20,25,35,.14);padding:18px 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
/* One question at a time, like the real funnel — so it can breathe. */
.fq .fl{font-size:17.5px;font-weight:600;color:#2b3340;margin-bottom:11px;line-height:1.3}
.fq .fl i{color:#e05252;font-style:normal}
.fopts{display:flex;flex-direction:column;gap:8px}
.fopt{display:flex;align-items:center;gap:10px;border:1px solid #e7eaee;background:#fbfcfd;border-radius:9px;
  padding:13px 15px;font-size:16px;color:#3a434f;cursor:pointer;font-family:inherit;text-align:left;transition:.12s;line-height:1.2}
.fopt:hover{border-color:var(--teal)}
.fopt i{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid #c3cad2;background:#fff;display:block}
.fopt.on{border-color:var(--teal);background:var(--teal-soft);color:#12706f;font-weight:600}
.fopt.on i{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 3px #fff}
.finput{border:1px solid #e7eaee;background:#fbfcfd;border-radius:9px;padding:14px 15px;font:inherit;font-size:16px;width:100%;color:#111}
.finput:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 2px rgba(46,196,198,.16)}
.fnext{margin-top:auto;background:#111;color:#fff;border:0;border-radius:9px;cursor:pointer;padding:14px;
  font:inherit;font-family:Poppins;font-weight:700;font-size:17px;letter-spacing:.02em}
.fprog{flex:none;display:flex;align-items:center;gap:9px;padding:0 16px 8px;font-size:12.5px;color:#8b949e;font-weight:600}
.fprog .track{flex:1;height:4px;background:#e9edf1;border-radius:999px;overflow:hidden}
.fprog .track i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .3s ease}
.fback{background:none;border:0;color:#8b949e;font:inherit;font-size:12px;cursor:pointer;padding:0;text-align:left}
.fdone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;gap:11px}
.fdone .big{font-size:46px;line-height:1}
.fdone h4{font-family:Poppins;font-weight:700;font-size:17px;margin:0}
.fdone p{margin:0;font-size:11px;color:var(--muted);line-height:1.45}
.frecap{width:100%;text-align:left;background:#f7fafb;border:1px solid #e4edee;border-radius:10px;padding:11px;
  font-size:10.5px;line-height:1.6;color:#33404b}
.frecap b{color:#111}
.fsand{display:inline-flex;align-items:center;gap:6px;background:#fff6e0;border:1px solid #ffe2a8;color:#8a6100;
  border-radius:999px;padding:5px 12px;font-size:10px;font-weight:700}
.sandbox-pill{display:inline-flex;align-items:center;gap:8px;background:#fff6e0;border:1px solid #ffe2a8;color:#8a6100;
  border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;margin-top:20px}
.sandbox-pill svg{width:15px;height:15px;flex:none}

/* ---------- slide 9: desktop browser view of the same funnel ---------- */
/* The artist's leads mostly arrive on mobile, but for a demo the desktop
   layout reads far better on a shared screen: one wide card, big type. */
.row-dtp{gap:42px;align-items:center}
.row-dtp .col-copy{flex:0 0 430px}
.row-dtp .col-visual{flex:1 1 auto;justify-content:flex-end}
.row-dtp ul.bullets li{font-size:24px;align-items:flex-start;line-height:1.35}
.row-dtp ul.bullets .chev{margin-top:2px}

/* macOS Safari window: light toolbar, traffic lights, centred address field */
.dtp{width:980px;height:712px;flex:none;background:#fff;border-radius:12px;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 44px 88px -30px rgba(13,15,18,.5),0 4px 14px rgba(13,15,18,.12),0 0 0 1px rgba(0,0,0,.1)}
.dtp-bar{position:relative;flex:none;height:52px;display:flex;align-items:center;gap:8px;padding:0 17px;
  background:linear-gradient(#f8f8f9,#eaeaec);border-bottom:1px solid #d5d5d8}
.dtp-dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14)}
.dtp-ico{display:flex;align-items:center;gap:19px;color:#9b9ba1}
.dtp-ico.l{margin-left:20px}
.dtp-ico.r{margin-left:auto}
.dtp-ico svg{width:17px;height:17px;display:block}
.dtp-url{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:400px;height:30px;background:#e2e2e5;color:#3b3b40;border-radius:7px;
  display:flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-family:Inter,sans-serif}
.dtp-url svg{width:11px;height:11px;flex:none;opacity:.65}
.dtp-vp{flex:1;min-height:0;background:#fff;overflow:hidden;position:relative}
/* the page itself — translated up instead of scrolled, so long questions stay in view */
.dtp-doc{position:absolute;left:0;right:0;top:0;transition:transform .45s cubic-bezier(.2,.7,.3,1)}

.dtp .fnl{display:block;background:#fff;font-family:Inter,sans-serif}
.dtp .fnl-bar{font-size:14.5px;padding:8px}
.dtp .fnl-tel{font-size:18px;padding:9px}
.dtp .fnl-brand{padding:10px 0 0}
.dtp .fnl-brand img{width:58px;height:58px}
.dtp .fnl-trust{font-size:16px;margin-top:7px}
.dtp .fnl-stars{font-size:18px;letter-spacing:2px}
.dtp .fnl-cong{font-size:18.5px;padding:8px 40px 0;line-height:1.32}
.dtp .fnl-h{font-size:27px;padding:7px 30px 0;line-height:1.2;white-space:nowrap}
.dtp .fnl-sec{font-size:18px;padding:2px 0 10px}
.dtp .fprog{max-width:700px;margin:0 auto;padding:0 0 11px;font-size:14px}
.dtp .fnl-card{max-width:700px;margin:0 auto 18px;padding:22px 26px;border-radius:12px;
  border:1px solid #e4e7e9;box-shadow:0 24px 48px -20px rgba(17,19,21,.28);gap:14px}
.dtp .fq .fl{font-size:20px;margin-bottom:16px}
.dtp .fopts{gap:9px}
.dtp .fopt{font-size:17px;padding:15px 18px;border-radius:10px;border:1.5px solid #cdeeed;background:#f4fbfb;gap:12px}
.dtp .fopt i{width:18px;height:18px}
/* the .dtp overrides above outrank .fopt.on, so restate the selected state */
.dtp .fopt.on{border-color:var(--teal);background:var(--teal-soft);color:#12706f;font-weight:600}
.dtp .fopt.on i{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 4px #fff}
.dtp .finput{font-size:18px;padding:16px 18px}
.dtp .fnext{font-size:19px;padding:16px}
.dtp .fback{font-size:14px}
.dtp .fdone{display:flex;padding:46px 40px;gap:14px}
.dtp .fdone .big{font-size:64px}
.dtp .fdone h4{font-size:25px}
.dtp .fdone p{font-size:16px;max-width:36em}
.dtp .frecap{font-size:15px;max-width:560px;padding:16px 18px}

/* ---------- slide 10: iMessage ---------- */
.ph-sms{width:352px;height:700px}
.ios-head{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0;
  background:rgba(247,247,248,.95);border-bottom:.5px solid #d6d6da;position:relative;font-family:var(--ios)}
.ios-back{position:absolute;left:12px;top:50%;transform:translateY(-30%);color:#0a84ff;display:flex;align-items:center;gap:2px;font-size:12px}
.ios-back svg{width:13px;height:13px}
.ios-badge{background:#ff3b30;color:#fff;border-radius:999px;padding:0 6px;font-size:10px;font-weight:700}
.ios-av{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid #e3e6ea;display:grid;
  place-items:center;overflow:hidden}
/* contain, not cover — the logo is wide and was being cropped to a blur */
.ios-av img{width:76%;height:76%;object-fit:contain}
.ios-name{font-size:12px;font-weight:500;color:#111;display:flex;align-items:center;gap:3px}
.ios-name svg{width:9px;height:9px;color:#9a9aa0}
.ios-body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;
  padding:12px 12px;background:#fff;font-family:var(--ios)}
.ios-stamp{text-align:center;font-size:10.5px;color:#8e8e93;margin:4px 0;font-weight:400}
.ios-stamp b{font-weight:600;color:#8e8e93}
.ios-row{display:flex;flex-direction:column;align-items:flex-start;opacity:0;transform:translateY(12px) scale(.97)}
.ios-row.in{animation:bin .42s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes bin{to{opacity:1;transform:none}}
.ios-bub{position:relative;max-width:86%;background:#e9e9eb;color:#000;border-radius:19px;padding:10px 15px;
  font-size:16px;line-height:1.34;white-space:pre-line;font-family:var(--ios);letter-spacing:-.01em}
.ios-bub::before{content:"";position:absolute;left:-5px;bottom:0;width:15px;height:17px;background:#e9e9eb;
  border-bottom-right-radius:17px;z-index:-1}
.ios-bub::after{content:"";position:absolute;left:-10px;bottom:0;width:11px;height:17px;background:#fff;border-bottom-right-radius:13px}
.ios-bub .hd{font-weight:600}
.ios-read{font-size:10px;color:#8e8e93;margin:2px 0 0 6px}
.typing{display:flex;gap:4px;align-items:center;background:#e9e9eb;border-radius:18px;padding:11px 15px;width:fit-content}
.typing i{width:7px;height:7px;border-radius:50%;background:#a3a3a8;animation:td 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes td{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.ios-foot{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:.5px solid #d6d6da;
  background:rgba(247,247,248,.95);color:#a8a8ae;font-size:13px;font-family:var(--ios)}
.ios-foot .plus{width:22px;height:22px;border-radius:50%;background:#e4e4e8;display:grid;place-items:center;color:#7b7b80;flex:none}
.ios-foot .inp{flex:1;background:#fff;border:.5px solid #d6d6da;border-radius:999px;padding:6px 12px}

/* ---------- slide 11: CRM ---------- */
.crm{width:100%;height:100%;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);
  border-radius:14px;overflow:hidden;box-shadow:0 20px 46px -22px rgba(20,25,35,.35)}
.crm-top{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:15px;color:#5b6470}
.crm-top .pill{background:var(--teal-soft);color:var(--teal-dark);font-weight:700;border-radius:999px;padding:3px 11px}
.crm-cols{flex:1;min-height:0;display:flex;gap:9px;padding:10px;background:#f7f9fb}
.crm-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;border-radius:9px;padding:4px;transition:.15s}
.crm-col.over{background:var(--teal-soft);outline:2px dashed var(--teal)}
.crm-h{font-size:22px;font-weight:700;color:#1b2228;display:flex;justify-content:space-between;align-items:center;
  gap:6px;padding:4px 4px 9px;border-bottom:2px solid var(--teal);white-space:nowrap}
.crm-h em{font-style:normal;color:#98a1ab;font-weight:600;font-size:16px}
.crm-card{background:#fff;border:1px solid #e8ecf1;border-radius:10px;padding:11px 12px;box-shadow:0 1px 2px rgba(20,25,35,.05);cursor:grab}
.crm-card.drag{opacity:.4}
.crm-card b{display:block;color:#111;font-weight:600;font-size:17px;line-height:1.3}
.crm-acts{display:flex;gap:4px;margin-top:7px}
.crm-acts button{flex:1;border:1px solid #e3e8ee;background:#fff;border-radius:7px;padding:5px 0;cursor:pointer;
  display:grid;place-items:center;color:#5b6470;transition:.12s}
.crm-acts button:hover{background:var(--teal);border-color:var(--teal);color:#fff}
.crm-acts svg{width:15px;height:15px}
.toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%,14px);background:#111;color:#fff;
  border-radius:999px;padding:9px 20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;
  transition:.28s;z-index:20;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hintline{position:absolute;right:70px;top:104px;font-size:12px;color:#98a1ab;z-index:5}

/* ---------- slide 12: the assistant ---------- */
.aitag{display:inline-block;border:2px solid var(--teal);border-radius:14px;padding:16px 26px;
  font-weight:600;font-size:23px;line-height:1.3;margin-bottom:24px;white-space:nowrap}
.robot{display:block;width:520px;margin:0 auto;height:auto;animation:float 4.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
.panel{background:var(--teal);color:#fff;border-radius:20px;padding:40px 36px;
  box-shadow:0 22px 50px -24px rgba(46,196,198,.85)}
.panel .num{display:flex;align-items:center;gap:22px;margin-bottom:30px}
.panel .num:last-child{margin-bottom:0}
.panel .num b{flex:none;width:64px;height:64px;border-radius:50%;background:#fff;color:var(--ink);
  display:grid;place-items:center;font-family:Poppins,sans-serif;font-weight:700;font-size:23px}
.panel .num span{font-weight:600;font-size:25px;line-height:1.32}

/* ---------- slide 16: educate-your-clients FAQ ---------- */
.faqbar{background:var(--teal);color:#fff;text-align:center;font-family:Poppins,sans-serif;font-weight:700;
  font-size:19px;border-radius:9px;padding:9px;margin-bottom:14px}
.faqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
/* hairline gradient border (teal -> soft gold -> teal) over a white card, lifted on a deep shadow */
.faqc{position:relative;border-radius:16px;background:#fff;cursor:pointer;
  border:1.5px solid transparent;
  background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#2EC4C6 0%,#d9c07a 55%,#2EC4C6 100%) border-box;
  box-shadow:0 18px 40px -22px rgba(20,25,35,.55),0 2px 6px rgba(20,25,35,.06);transition:transform .18s,box-shadow .18s}
.faqc:hover{transform:translateY(-3px);box-shadow:0 26px 48px -22px rgba(20,25,35,.6),0 2px 6px rgba(20,25,35,.06)}
.faqc .qh{display:flex;align-items:center;gap:9px;padding:13px 16px 11px;
  font-family:Poppins,sans-serif;font-weight:600;font-size:16px;line-height:1.28;color:#1b2228}
.faqc .qh .cr{margin-left:auto;flex:none;color:var(--teal);transition:transform .22s}
.faqc.open .qh .cr{transform:rotate(180deg)}
.faqc .qh svg{width:15px;height:15px}
.faqc .ans{max-height:0;overflow:hidden;transition:max-height .28s ease;
  font-family:Poppins,sans-serif;font-size:14.5px;line-height:1.5;color:#4a5560;padding:0 16px}
.faqc.open .ans{max-height:210px;padding-bottom:12px}
/* the video sits in its own dark inset frame, like a screening-room monitor */
.faqvid{position:relative;margin:0 12px 12px;height:216px;border-radius:12px;overflow:hidden;cursor:pointer;
  background:#0d1114;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 10px 24px -14px rgba(0,0,0,.7)}
.faqvid video{width:100%;height:100%;object-fit:contain;display:block}
.faqvid .pl{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .2s;
  background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.35) 100%)}
.faqvid.playing .pl{opacity:0;pointer-events:none}
.faqvid .pl i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.85);backdrop-filter:blur(3px);
  box-shadow:0 0 0 8px rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.45);transition:transform .15s}
.faqvid:hover .pl i{transform:scale(1.06)}
.faqvid .pl svg{width:40%;height:40%;color:#fff;margin-left:3px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.faqvid .dur{position:absolute;right:10px;bottom:9px;background:rgba(0,0,0,.62);color:#fff;border-radius:6px;
  padding:3px 8px;font-size:11.5px;font-weight:600;letter-spacing:.03em;font-variant-numeric:tabular-nums;
  backdrop-filter:blur(3px)}
.faqvid .tag{position:absolute;left:10px;top:9px;display:flex;align-items:center;gap:6px;color:#fff;
  background:rgba(0,0,0,.5);border-radius:6px;padding:3px 8px;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;backdrop-filter:blur(3px)}
.faqvid .tag i{width:6px;height:6px;border-radius:50%;background:#d9c07a}

/* ---------- slide 13: area exclusivity ---------- */
.mapwrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.mapimg{position:relative;width:min(100%,1120px)}
.mapimg img{width:100%;display:block}
.pin{position:absolute;width:26px;height:34px;transform:translate(-50%,-100%);color:var(--teal);
  opacity:0;filter:drop-shadow(0 2px 3px rgba(20,25,35,.28))}
.pin svg{width:100%;height:100%;display:block}
.slide.on .pin{animation:pindrop .42s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pindrop{from{opacity:0;transform:translate(-50%,-135%) scale(.6)}to{opacity:1;transform:translate(-50%,-100%) scale(1)}}
.statcard{position:absolute;left:0;bottom:12%;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:20px 26px;box-shadow:0 18px 40px -20px rgba(20,25,35,.4);text-align:center}
.statcard .k{font-family:Poppins,sans-serif;font-weight:700;color:var(--teal-dark);font-size:34px}
.statcard .v{font-family:Poppins,sans-serif;font-size:24px;font-weight:600;color:#2b3340;margin-top:9px}

/* ---------- slide 14: setting expectations ---------- */
.expect{display:flex;gap:44px;align-items:center;width:100%}
.expect .txt{flex:1}
.expect .lead{font-family:Poppins,sans-serif;font-weight:700;font-size:31px;line-height:1.4;margin:0 0 24px}
.expect ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:15px}
.expect li{font-family:Poppins,sans-serif;font-size:27px;line-height:1.4;color:#2b3340}
.expect .pic{flex:none;width:470px;border-radius:16px;overflow:hidden;box-shadow:0 18px 40px -22px rgba(20,25,35,.55)}
.expect .pic img{width:100%;display:block}

/* ---------- slide 20: plans ---------- */
.plans{display:flex;gap:22px;width:100%;align-items:stretch}
.plan{flex:1;background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 26px;position:relative;
  display:flex;flex-direction:column;gap:10px;box-shadow:0 16px 38px -24px rgba(20,25,35,.5)}
.plan.pop{border-color:var(--teal);box-shadow:0 20px 44px -20px rgba(46,196,198,.65);transform:translateY(-8px)}
.plan .badge{position:absolute;top:-13px;right:16px;background:var(--teal);color:#fff;border-radius:999px;
  padding:6px 16px;font-family:Poppins,sans-serif;font-size:14px;font-weight:700;letter-spacing:.05em}
.plan h3{margin:0;text-align:center;font-family:Poppins,sans-serif;font-size:30px;font-weight:700;letter-spacing:.01em}
.plan .kind{text-align:center;font-family:Poppins,sans-serif;font-size:21px;color:var(--muted)}
.plan .price{text-align:center;font-family:Poppins,sans-serif;font-weight:800;font-size:56px;margin:4px 0}
.plan .price em{font-style:normal;font-size:.44em;font-weight:600;color:var(--muted)}
.plan .save{background:var(--teal-soft);color:var(--teal-dark);border-radius:10px;text-align:center;
  font-family:Poppins,sans-serif;font-weight:700;padding:11px;font-size:23px;line-height:1.3}
.plan ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.plan li{display:flex;gap:10px;align-items:flex-start;font-family:Poppins,sans-serif;font-size:21px;color:#3a434f;line-height:1.35}
.plan li svg{width:19px;flex:none;color:var(--teal);margin-top:2px}
.plan .guar{margin-top:auto;padding-top:14px;font-family:Poppins,sans-serif;font-size:20px;color:var(--teal-dark);
  font-weight:700;text-align:center;line-height:1.35}
.specialbar{margin-top:20px;background:var(--teal);color:#fff;border-radius:13px;text-align:center;padding:16px;
  font-family:Poppins,sans-serif;font-size:23px;font-weight:600}
.specialbar b{font-weight:800}

/* ---------- slide 17: FB group ---------- */
.fbg{width:100%;max-width:640px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 18px 44px -24px rgba(20,25,35,.5)}
.fbg .cover{height:210px;position:relative;background:#eef1f4;overflow:hidden}
.fbg .cover img{width:100%;height:100%;object-fit:cover;display:block}
.fbg .cover .mark{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-family:Poppins;
  font-weight:800;font-size:26px;letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.fbg .bd{padding:18px 22px 20px}
.fbg h4{margin:0 0 5px;font-family:Poppins;font-size:23px}
.fbg .meta{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:7px}
.fbg .meta svg{width:15px;height:15px}
.fbg .mem{display:flex;align-items:center;margin-top:12px}
.fbg .mem i{width:44px;height:44px;border-radius:50%;border:2px solid #fff;margin-left:-11px;
  background-size:cover;background-position:center;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.fbg .mem i:first-child{margin-left:0}
.fbg .mem span{margin-left:12px;font-size:14px;color:var(--muted);font-weight:600}
.fbg .btns{display:flex;gap:9px;margin-top:14px}
.fbg .btns b{flex:1;text-align:center;background:#1877F2;color:#fff;border-radius:7px;padding:10px;font-size:15px;font-weight:600}
.fbg .btns u{flex:none;text-decoration:none;background:#e4e6eb;color:#050505;border-radius:7px;padding:10px 22px;font-size:15px;font-weight:600}

/* ---------- slide 19: ROI calculator ---------- */
.calcwrap{width:100%;display:flex;justify-content:center}
.calcdev{width:1060px;background:linear-gradient(180deg,#1e262c,#151b20);border-radius:22px;padding:22px 26px;
  box-shadow:0 26px 58px -24px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.08);
  display:flex;flex-direction:column;gap:12px}
/* each step stays hidden until the one above it is answered */
.cstep{background:#232c33;border-radius:14px;padding:15px 20px;display:flex;align-items:center;gap:20px}
.cstep.locked{display:none}
.cstep.reveal{animation:stepin .4s cubic-bezier(.2,.7,.3,1) both}
@keyframes stepin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cstep .no{flex:none;width:38px;height:38px;border-radius:50%;background:var(--teal);color:#0f1519;
  display:grid;place-items:center;font-family:Poppins,sans-serif;font-weight:800;font-size:18px}
.cstep .lbl{flex:1;font-family:Poppins,sans-serif;font-size:22px;font-weight:700;color:#e7edf1}
.stepper{flex:none;display:flex;align-items:center;gap:12px}
.stepper button{width:42px;height:42px;border-radius:11px;border:1px solid #3a464f;background:#2c363e;color:#e7edf1;
  font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center;font-family:inherit;transition:.13s}
.stepper button:hover:not(:disabled){background:var(--teal);border-color:var(--teal);color:#0f1519}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper .amt{min-width:132px;text-align:center;font-family:"SF Mono",ui-monospace,Menlo,monospace;
  font-weight:700;font-size:30px;color:#4fe0d6;font-variant-numeric:tabular-nums}
.stepper .amt em{font-style:normal;font-size:17px;color:#9fb0bb;font-family:Poppins,sans-serif;font-weight:600}
.permo{font-family:Poppins,sans-serif;font-size:16px;font-weight:600;color:#8496a2;margin-left:-4px;min-width:88px}
.slide-ctl{flex:none;display:flex;align-items:center;gap:16px}
.slide-ctl input[type=range]{width:300px;accent-color:var(--teal);height:26px;margin:0}
.slide-ctl .amt{min-width:86px;text-align:right;font-family:"SF Mono",ui-monospace,Menlo,monospace;
  font-weight:700;font-size:30px;color:#4fe0d6;font-variant-numeric:tabular-nums}
.cnext{flex:none;background:var(--teal);color:#0f1519;border:0;border-radius:11px;padding:11px 22px;cursor:pointer;
  font-family:Poppins,sans-serif;font-weight:700;font-size:17px;transition:.13s}
.cnext:hover{filter:brightness(1.08)}
.cout{display:flex;align-items:center;gap:16px;padding:1px 8px}
.cout.locked{display:none}
.cout.reveal{animation:stepin .4s cubic-bezier(.2,.7,.3,1) both}
.cout .arrow{color:#4a5760;flex:none}
.cout .arrow svg{width:22px;height:22px;display:block}
.cout .cell{display:flex;align-items:baseline;gap:10px}
.cout .cell .k{font-size:16px;color:#9fb0bb;font-weight:600}
.cout .cell .v{font-family:Poppins,sans-serif;font-weight:800;font-size:30px;color:#fff;line-height:1}
.cout .plus,.cout .eq{color:#6b7a85;font-size:22px;font-weight:700}
.cout .note{margin-left:auto;font-size:14px;color:#8496a2}
.cout .cell.total .v{color:#4fe0d6;font-size:34px}
.ctotal{background:var(--teal);color:#fff;border-radius:14px;padding:17px 24px;display:flex;align-items:center;
  justify-content:space-between;box-shadow:0 16px 34px -18px rgba(46,196,198,.8)}
.ctotal.locked{display:none}
.ctotal.reveal{animation:stepin .45s cubic-bezier(.2,.7,.3,1) both}
.ctotal .k{font-size:15px;font-weight:700;opacity:.92;text-transform:uppercase;letter-spacing:.07em}
.ctotal .v{font-family:Poppins,sans-serif;font-weight:800;font-size:54px;line-height:1.05}
.ctotal .r{text-align:right;font-size:15px;font-weight:600;opacity:.95;line-height:1.35}
.ctotal .r b{display:block;font-size:44px;line-height:1.08;font-family:Poppins,sans-serif}
.creset.locked{display:none}
.creset{align-self:center;background:none;border:0;color:#7d8c97;font:inherit;font-size:14px;cursor:pointer;padding:2px}
.creset:hover{color:#b9c6cf}

/* ---------- nav / grid ---------- */
#nav{position:fixed;bottom:14px;right:16px;z-index:80;display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:999px;padding:5px 7px;
  box-shadow:0 6px 22px -8px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
#nav button{width:30px;height:30px;border-radius:50%;border:0;background:#f1f4f7;color:#3a434f;font-size:15px;
  cursor:pointer;display:grid;place-items:center;transition:.15s}
#nav button:hover{background:var(--teal);color:#fff}
#nav .pos{font-size:12px;font-weight:700;color:#6b747f;padding:0 5px;font-variant-numeric:tabular-nums;cursor:pointer;user-select:none}
.hint{position:fixed;bottom:19px;left:50%;transform:translateX(-50%);z-index:80;font-size:11px;color:#6b747f;pointer-events:none}
#bar{position:fixed;top:0;left:0;height:3px;background:var(--teal);z-index:90;transition:width .3s ease}
#grid{position:fixed;inset:0;z-index:95;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);display:none;padding:30px;overflow:auto}
#grid.on{display:block}
#grid h3{margin:0 0 15px;font-size:14px;color:#6b747f;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.gcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:#fff;transition:.15s}
.gcard:hover{border-color:var(--teal);box-shadow:0 8px 20px -12px rgba(46,196,198,.7);transform:translateY(-2px)}
.gcard.cur{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}
.gcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#eef1f4}
.gcard .cap{padding:7px 9px;font-size:11.5px;font-weight:600;display:flex;justify-content:space-between;gap:6px}
.gcard .cap em{font-style:normal;color:#aab3bd;font-weight:700}
.gcard .cap .lv{color:#ff4d4f;font-weight:700;font-size:10px}

/* ---------- quick start deck: what's included + next steps ---------- */
.incl{position:relative;z-index:2;flex:1;min-height:0;display:flex;gap:26px;align-items:stretch;padding-bottom:26px}
.incl-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 34px;
  box-shadow:0 18px 40px -26px rgba(20,25,35,.45);display:flex;flex-direction:column}
.incl-card.main{flex:1.32;padding:22px 30px 22px}
.incl-card.main ul{flex:none;gap:11px}
.incl-card.main h3{margin-bottom:12px}
.incl-card.main h3.bon{margin:16px 0 12px;padding-top:14px;border-top:1px dashed #cfd6de}
.incl-card.main li i{width:30px;height:30px;margin-top:3px}
.incl-card.main li b{font-size:24px}

ht:400\"> </span><span style=\"color:#01c9bf\">right time.</span></p><p class=\"rv li ul\" style=\"animation-delay:1.08s;font:400 28.3px/normal Poppins;color:#000000\">Collect a <span style=\"font-weight:700;color:#28c4bc\">deposit</span> ($25-$50).</p></div><div class=\"tx\" style=\"left:91.2px;top:718.8px;width:1005px\"><p class=\"rv\" style=\"animation-delay:1.20s;font:700 26.7px/normal Poppins;color:#6aa84f\">Can we get 100% confirmation you’re committed to those this for the sake us helping you hit your revenue goals?</p></div>"});
SLIDES.push({n:126,t:"Referrals vs. online ads",th:"t-lc-26",html:"<img class=\"art\" src=\"/deck/assets/launch/a26.webp\" alt=\"\" decoding=\"async\"><div class=\"tx\" style=\"left:312.5px;top:155px;width:993.8px\"><p class=\"rv\" style=\"animation-delay:0.12s;font:700 60px/normal Inter;color:#000000\">Referrals Vs. Online Advertising</p></div><div class=\"tx\" style=\"left:217.5px;top:351.2px;width:1216.2px\"><p class=\"rv\" style=\"animation-delay:0.24s;font:400 28.3px/normal Poppins;color:#000000\">Switching from referrals to online ads can feel like lead quality is lower, but it’s not—they’re just at a different stage in the buying process. </p><p style=\"font-size:28.3px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.36s;font:400 28.3px/normal Poppins;color:#000000\">While referrals already trust you and are ready to book, online leads need more nurturing and education to build that trust.</p></div>"});
SLIDES.push({n:127,t:"Online marketing vs. referrals",th:"t-lc-27",html:"<img class=\"art\" src=\"/deck/assets/launch/a27.webp\" alt=\"\" decoding=\"async\"><div class=\"tx\" style=\"left:122.5px;top:108.8px;width:556.2px\"><p class=\"rv\" style=\"animation-delay:0.12s;font:700 60px/normal Inter;color:#000000\">Online Marketing</p></div><div class=\"tx\" style=\"left:1047.5px;top:260px;width:431.2px\"><p class=\"rv\" style=\"animation-delay:0.24s;font:400 26.7px/normal Poppins;color:#000000;text-align:center\">Finally…After learning about PMU and meet you, things “clicked” and they signed up!</p></div><div class=\"tx\" style=\"left:122.5px;top:306.2px;width:165px\"><p class=\"rv\" style=\"animation-delay:0.36s;font:400 26.7px/normal Poppins;color:#000000;text-align:center\">Just saw<br>your ad…</p></div><div class=\"tx\" style=\"left:362.5px;top:306.2px;width:317.5px\"><p class=\"rv\" style=\"animation-delay:0.48s;font:400 26.7px/normal Poppins;color:#000000;text-align:center\">Signed up but are a little skeptical…</p></div><div class=\"tx\" style=\"left:753.8px;top:302.5px;width:278.8px\"><p class=\"rv\" style=\"animation-delay:0.60s;font:400 26.7px/normal Poppins;color:#000000;text-align:center\">Came in and are still a little skeptical…</p></div><div class=\"tx\" style=\"left:122.5px;top:685px;width:300px\"><p class=\"rv\" style=\"animation-delay:0.72s;font:700 60px/normal Inter;color:#000000\">Referrals</p></div><div class=\"tx\" style=\"left:690px;top:728.8px;width:406.2px\"><p class=\"rv\" style=\"animation-delay:0.84s;font:400 26.7px/normal Poppins;color:#000000;text-align:center\">Came in excited after hearing AMAZING things about you</p></div><div class=\"tx\" style=\"left:1100px;top:730px;width:292.5px\"><p class=\"rv\" style=\"animation-delay:0.96s;font:400 26.7px/normal Poppins;color:#000000;text-align:center\">Signed up without hesitation</p></div>"});
SLIDES.push({n:128,t:"The hidden gems",th:"t-lc-28",html:"<img class=\"art\" src=\"/deck/assets/launch/a28.webp\" alt=\"\" decoding=\"async\"><div class=\"tx\" style=\"left:176.2px;top:132.5px;width:571.2px\"><p class=\"rv\" style=\"animation-delay:0.12s;font:700 60px/normal Inter;color:#000000\">Referrals Vs. Online Advertising</p></div><div class=\"tx\" style=\"left:783.8px;top:161.2px;width:793.8px\"><p class=\"rv li ul\" style=\"animation-delay:0.24s;font:400 28.3px/normal Poppins;color:#ffffff\">Unlike referrals, we’re not trying to convert everyone!</p><p class=\"rv li ul\" style=\"animation-delay:0.36s;font:400 28.3px/normal Poppins;color:#ffffff\">Out of 50–100 leads per month, we’re targeting the hidden gems (2–3 out of 10). </p><p class=\"rv li ul\" style=\"animation-delay:0.48s;font:400 28.3px/normal Poppins;color:#ffffff\">The power of online ads lies in their consistency and predictability, giving you reliable results every month.</p><p class=\"rv li ul\" style=\"animation-delay:0.60s;font:400 28.3px/normal Poppins;color:#ffffff\"> Once mastered, you’ll have a proven system to scale and grow at your own pace.</p></div>"});
SLIDES.push({n:129,t:"90 Days Transformation",th:"t-lc-29",html:"<img class=\"art\" src=\"/deck/assets/launch/a29.webp\" alt=\"\" decoding=\"async\"><div class=\"tx\" style=\"left:52px;top:-42.5px;width:1691.2px\"><p class=\"rv\" style=\"animation-delay:0.12s;font:700 398.3px/normal Inter;color:#fafafa\">90 Days</p></div><div class=\"tx\" style=\"left:148.8px;top:127.5px;width:941.2px\"><p class=\"rv\" style=\"animation-delay:0.24s;font:400 60px/normal Inter;color:#000000\">90 Days <span style=\"font-weight:700\">Transformation</span></p></div><div class=\"tx\" style=\"left:353.8px;top:285px;width:941.2px\"><p class=\"rv\" style=\"animation-delay:0.36s;font:700 60px/normal Inter;color:#ff0000;text-align:center\">REMEMBER</p></div><div class=\"tx\" style=\"left:93.8px;top:421.2px;width:1460px\"><p class=\"rv\" style=\"animation-delay:0.48s;font:400 26.7px/normal Poppins;color:#000000\">Like anything new, it can be amazing right away — but sometimes, it takes time to work out the kinks.</p><p style=\"font-size:26.7px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.60s;font:400 26.7px/normal Poppins;color:#000000\">We’ve had PMU partners who almost gave up, but after committing for 90 days, ended up having record-breaking months and booked more clients than ever before.</p><p style=\"font-size:26.7px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.72s;font:700 26.7px/normal Poppins;color:#000000\">Our data shows that the best results come from those who commit to 90 days and focus on making it work for their business.</p></div><div class=\"tx\" style=\"left:93.8px;top:743.8px;width:1412.5px\"><p class=\"rv\" style=\"animation-delay:0.84s;font:700 31.7px/normal Poppins;color:#6aa84f;text-align:center\">Just remember - you are in good hands. Anytime you tell us something you have our promise that we will find a solution as quickly as possible</p></div>"});
SLIDES.push({n:130,t:"Open Communication",th:"t-lc-30b",html:"<img class=\"art\" src=\"/deck/assets/launch/a30.webp\" alt=\"\" decoding=\"async\"><div class=\"tx\" style=\"left:133.8px;top:137.5px;width:796.2px\"><p class=\"rv\" style=\"animation-delay:0.12s;font:400 60px/normal Inter;color:#000000\">Open<span style=\"font-weight:700\"> </span><span style=\"font-weight:700;font-size:73.3px\">Communication</span></p></div><div class=\"tx\" style=\"left:52px;top:308.8px;width:821.2px\"><p style=\"font-size:30px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.24s;font:700 30px/normal Poppins;color:#000000\">Phone: <span style=\"font-weight:400\">(206) 429-4626</span></p><p class=\"rv\" style=\"animation-delay:0.36s;font:700 30px/normal Poppins;color:#000000\">Email: <span style=\"font-weight:400;color:#467886;text-decoration:underline\"><a data-coach-email href=\"mailto:success@pmu-bookings.com\">success@pmu-bookings.com</a></span></p><p style=\"font-size:30px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.48s;font:700 30px/normal Arial;color:#000000\">Response Times<span style=\"font-weight:400\">: We’ll get back to you between 9am-6pm Eastern, Monday-Friday</span></p><p style=\"font-size:30px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.60s;font:700 30px/normal Arial;color:#000000\">Strategy Calls Schedule: <span style=\"font-weight:400\">We’ll invite you for a according to your needs. (You can always reach out to book)</span></p></div>"});
SLIDES.push({n:131,t:"Open Communication — strategy calls",th:"t-lc-31",html:"<img class=\"art\" src=\"/deck/assets/launch/a31.webp\" alt=\"\" decoding=\"async\"><div class=\"tx\" style=\"left:173.8px;top:127.5px;width:638.8px\"><p class=\"rv\" style=\"animation-delay:0.12s;font:400 60px/normal Inter;color:#000000\">Open<span style=\"font-weight:700\"> </span><span style=\"font-weight:700;font-size:73.3px\">Communication</span></p></div><div class=\"tx\" style=\"left:663.8px;top:381.2px;width:923.8px\"><p class=\"rv\" style=\"animation-delay:0.24s;font:400 26.7px/normal Poppins;color:#000000\">We believe in being straightforward, honest, and real. Expect constructive feedback from us—being coachable and open-minded is key to achieving the best results.</p><p style=\"font-size:26.7px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.36s;font:400 26.7px/normal Poppins;color:#000000\">Throughout the process, we’ll invite you to strategy calls to share valuable insights and tips for increasing booking rate.</p><p style=\"font-size:26.7px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.48s;font:700 26.7px/normal Poppins;color:#000000\">It’s essential for your success, </p><p class=\"rv\" style=\"animation-delay:0.60s;font:700 26.7px/normal Poppins;color:#000000\">book these strategy calls as soon as possible!</p></div>"});
SLIDES.push({n:132,t:"Open Communication — tell us",th:"t-lc-32",html:"<img class=\"art\" src=\"/deck/assets/launch/a32.webp\" alt=\"\" decoding=\"async\"><div class=\"tx\" style=\"left:133.8px;top:137.5px;width:638.8px\"><p class=\"rv\" style=\"animation-delay:0.12s;font:400 60px/normal Inter;color:#000000\">Open<span style=\"font-weight:700\"> </span><span style=\"font-weight:700;font-size:73.3px\">Communication</span></p></div><div class=\"tx\" style=\"left:82.5px;top:387.5px;width:927.5px\"><p class=\"rv\" style=\"animation-delay:0.24s;font:400 26.7px/normal Poppins;color:#000000\">We can solve challenges together when we’re aware of them.</p><p style=\"font-size:26.7px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.36s;font:400 26.7px/normal Poppins;color:#000000\">We want you to feel confident and satisfied throughout the process.</p><p style=\"font-size:26.7px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.48s;font:400 26.7px/normal Poppins;color:#000000\">Keep us informed so we can address any issues right away and ensure the best results.</p><p style=\"font-size:26.7px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.60s;font:400 26.7px/normal Poppins;color:#000000\">Clear communication is key to our success</p><p style=\"font-size:26.7px;line-height:normal\">&nbsp;</p><p style=\"font-size:26.7px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.72s;font:400 26.7px/normal Poppins;color:#000000\">I’m not a psychic yet, but I’m certainly working on it…</p></div>"});
SLIDES.push({n:133,t:"Last few things — lead pace",th:"t-lc-33",html:"<img class=\"art\" src=\"/deck/assets/launch/a33.webp\" alt=\"\" decoding=\"async\"><div class=\"tx\" style=\"left:865px;top:157.5px;width:540px\"><p class=\"rv\" style=\"animation-delay:0.12s;font:400 60px/normal Inter;color:#000000\">Last<span style=\"font-weight:700\"> </span></p><p class=\"rv\" style=\"animation-delay:0.24s;font:700 73.3px/normal Inter;color:#000000\">few things!</p></div><div class=\"tx\" style=\"left:758.8px;top:370px;width:828.8px\"><p class=\"rv\" style=\"animation-delay:0.36s;font:400 28.3px/normal Poppins;color:#000000\">If leads slow down, that’s totally normal—</p><p class=\"rv\" style=\"animation-delay:0.48s;font:700 28.3px/normal Poppins;color:#000000\">results are evaluated on a 2-week cycle.</p><p class=\"rv\" style=\"animation-delay:0.60s;font:400 28.3px/normal Poppins;color:#000000\">If you’re overwhelmed with leads, please let us know so we can adjust to your pace.</p><p class=\"rv\" style=\"animation-delay:0.72s;font:400 28.3px/normal Poppins;color:#000000\">Feel stuck? start by watching the videos.</p><p class=\"rv\" style=\"animation-delay:0.84s;font:400 28.3px/normal Poppins;color:#000000\">Still stuck? We’ll help by connecting you with a successful PMU artist.</p><p class=\"rv\" style=\"animation-delay:0.96s;font:400 28.3px/normal Poppins;color:#000000\">We’ll handle growing your business while you focus on serving your clients.</p></div>"});
SLIDES.push({n:134,t:"Last few things — Facebook ID check",th:"t-lc-34",html:"<img class=\"art\" src=\"/deck/assets/launch/a34.webp\" alt=\"\" decoding=\"async\"><div class=\"tx\" style=\"left:143.8px;top:130px;width:540px\"><p class=\"rv\" style=\"animation-delay:0.12s;font:400 60px/normal Inter;color:#000000\">Last<span style=\"font-weight:700\"> </span></p><p class=\"rv\" style=\"animation-delay:0.24s;font:700 73.3px/normal Inter;color:#000000\">few things!</p></div><div class=\"tx\" style=\"left:52px;top:351.2px;width:798.8px\"><p class=\"rv\" style=\"animation-delay:0.36s;font:400 26.7px/normal Poppins;color:#000000\">If we’re using a new ad account, <span style=\"font-weight:700\">Facebook may ask you to verify your identity.</span></p><p class=\"rv\" style=\"animation-delay:0.48s;font:400 26.7px/normal Poppins;color:#000000\">You’ll receive an email stating that your account has been temporarily disabled. Simply submit a photo of your ID, and they will reactivate the account within 24–72 hours.</p></div>"});
SLIDES.push({n:135,t:"Last few things — Facebook charges",th:"t-lc-35",html:"<img class=\"art\" src=\"/deck/assets/launch/a35.webp\" alt=\"\" decoding=\"async\"><div class=\"tx\" style=\"left:143.8px;top:130px;width:540px\"><p class=\"rv\" style=\"animation-delay:0.12s;font:400 60px/normal Inter;color:#000000\">Last<span style=\"font-weight:700\"> </span></p><p class=\"rv\" style=\"animation-delay:0.24s;font:700 73.3px/normal Inter;color:#000000\">few things!</p></div><div class=\"tx\" style=\"left:52px;top:351.2px;width:798.8px\"><p class=\"rv\" style=\"animation-delay:0.36s;font:400 26.7px/normal Poppins;color:#000000\">Over time, Facebook will increase our trust score and spending threshold. You may see different charge amounts, but they will <span style=\"font-weight:700\">always align with the daily budget we set.</span></p><p class=\"rv\" style=\"animation-delay:0.48s;font:400 26.7px/normal Poppins;color:#000000\">For example, if our Facebook daily spend is $20/day, the threshold may increase to $60 after two weeks, resulting in charges every three days at $20/day.</p></div>"});
SLIDES.push({n:136,t:"Last few things — payment policy",th:"t-lc-36",html:"<img class=\"art\" src=\"/deck/assets/launch/a36.webp\" alt=\"\" decoding=\"async\"><div class=\"tx\" style=\"left:823.8px;top:103.8px;width:525px\"><p class=\"rv\" style=\"animation-delay:0.12s;font:400 60px/normal Inter;color:#000000\">Last<span style=\"font-weight:700\"> </span></p><p class=\"rv\" style=\"animation-delay:0.24s;font:700 73.3px/normal Inter;color:#000000\">few things!</p></div><div class=\"tx\" style=\"left:716.2px;top:305px;width:871.2px\"><p class=\"rv\" style=\"animation-delay:0.36s;font:700 28.3px/normal Poppins;color:#000000\">Facebook’s Strict Payment Policy</p><p style=\"font-size:28.3px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.48s;font:400 28.3px/normal Poppins;color:#000000\">“If all of your payment methods fail, we'll stop all the ads you're running until your balance has been paid.” - <span style=\"font-weight:700;color:#0000ff\">Facebook</span></p><p style=\"font-size:28.3px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.60s;font:400 28.3px/normal Poppins;color:#000000\">This affects our ad account and our ability to continue business on it.</p><p style=\"font-size:28.3px;line-height:normal\">&nbsp;</p><p style=\"font-size:28.3px;line-height:normal\">&nbsp;</p><p style=\"font-size:28.3px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.72s;font:700 31.7px/normal Poppins;color:#6aa84f;text-align:center\">Let your bank know of charges and let us know of any card changes!</p></div><div class=\"tx\" style=\"left:956.2px;top:645px;width:370px\"><p class=\"rv\" style=\"animation-delay:0.84s;font:700 41.7px/normal Poppins;color:#ff0000;text-align:center\">IMPORTANT!</p></div>"});
live(137,"Phishing links",head(0)+"<div class=\"phish-top\"><span class=\"warn rv\" style=\"animation-delay:.1s\">&#9888;&#65039;</span><div><p class=\"lede rv\" style=\"animation-delay:.18s;margin:0 0 10px;max-width:none\"><b>We follow Facebook and Instagram rules and policies.</b></p><p class=\"lede rv\" style=\"animation-delay:.3s;margin:0;max-width:none\"><b style=\"color:#e02424\">NEVER</b> click on <b>“phishing links”</b>. If you have any doubts, feel free to send us a screenshot.</p></div></div><div class=\"scams\"><div class=\"scam rv\" style=\"animation-delay:0.50s\"><b>Last warning ⚠️</b><p>We haven’t received your response yet. Your page has been warned for copyright infringement and you should contact and confirm your page. If you do not continue to confirm, our system will automatically block your account.</p><p class=\"lnk\">Contact us for help: business-portal-administration.com/…</p><span class=\"stamp\" style=\"animation-delay:1.50s\">SCAM</span></div><div class=\"scam rv\" style=\"animation-delay:0.72s\"><b>Dear admin!</b><p>Important notification: your Facebook page is scheduled to be permanently deleted due to a post that violated our trademark rights. If you believe this is a misunderstanding, submit an appeal before we remove it.</p><p class=\"lnk\">Please submit your request here: …</p><span class=\"stamp\" style=\"animation-delay:1.95s\">SCAM</span></div><div class=\"scam rv\" style=\"animation-delay:0.94s\"><b>*Page limit notification ⚠️!</b><p>Hello admin, some features of your page have been limited. The period is limited to 30 days. If you would like to request a review of this decision, please visit the link and provide specific information.</p><p class=\"lnk\">Verification time is 24–48 hours</p><span class=\"stamp\" style=\"animation-delay:2.40s\">SCAM</span></div></div>");

SLIDES.push({n:146,t:"The $50 Deposit",th:"t-lc-46",html:"<img class=\"art\" src=\"/deck/assets/launch/a46.webp\" alt=\"\" decoding=\"async\"><div class=\"tx\" style=\"left:153.8px;top:153.8px;width:632.5px\"><p class=\"rv\" style=\"animation-delay:0.12s;font:700 71.7px/normal Inter;color:#000000\">The $50 Deposit</p></div><div class=\"tx\" style=\"left:105px;top:330px;width:1000px\"><p class=\"rv\" style=\"animation-delay:0.24s;font:400 31.7px/normal Poppins;color:#000000\">✅ We collect a deposit from every client we book on your calendar through PMU Bookings On Demand.</p><p style=\"font-size:31.7px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.36s;font:400 31.7px/normal Poppins;color:#000000\">✅ The deposit confirms the client is serious and will show up.</p><p style=\"font-size:31.7px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.48s;font:400 31.7px/normal Poppins;color:#000000\">✅ Protects your time and reduces no-shows.</p><p style=\"font-size:31.7px;line-height:normal\">&nbsp;</p><p class=\"rv\" style=\"animation-delay:0.60s;font:400 31.7px/normal Poppins;color:#000000\">✅ Will be deducted from the first initial service </p><p class=\"rv\" style=\"animation-delay:0.72s;font:400 31.7px/normal Poppins;color:#000000\">(You can add $50 on touch-up).</p></div>"});

var stage=document.getElementById("stage");
stage.innerHTML=SLIDES.map(function(s,k){
  return '<section class="slide" data-i="'+k+'">'+
    (s.img ? '<img class="full" src="/deck/assets/slides/s-'+pad(s.n)+'.jpg" alt="">' : s.html)+'</section>';
}).join("");
var nodes=[].slice.call(stage.children);

document.getElementById("gg").innerHTML=SLIDES.map(function(s,k){
  return '<div class="gcard" data-i="'+k+'"><img src="/deck/assets/thumbs/'+(s.th||('t-'+pad(s.n)))+'.jpg" alt="" loading="lazy">'+
    '<div class="cap"><span>'+s.t+'</span>'+'<em>'+(k+1)+'</em>'+'</div></div>';
}).join("");

/* scale the 1600x900 stage to whatever screen it is shown on */
function fit(){
  var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
  stage.style.transform="translate(-50%,-50%) scale("+s+")";
}
window.addEventListener("resize",fit); fit();

var pos=document.getElementById("pos"),bar=document.getElementById("bar"),grid=document.getElementById("grid"),i=0;
function show(n){
  i=Math.max(0,Math.min(nodes.length-1,n));
  nodes.forEach(function(s,k){s.classList.toggle("on",k===i);});
  pos.textContent=(i+1)+" / "+nodes.length;
  bar.style.width=((i+1)/nodes.length*100)+"%";
  [].forEach.call(grid.querySelectorAll(".gcard"),function(c,k){c.classList.toggle("cur",k===i);});
  restagger(nodes[i]);
  nodes[i].querySelectorAll("video[autoplay]").forEach(function(v){v.play().catch(function(){});});
  var num=SLIDES[i].n;
  try{history.replaceState(null,"",location.pathname+location.search+"#"+(i+1));}catch(e){}
  if(num===152) runBook();
  if(num===158) runPause();
  if(num===9 && window.fFit) fFit();   // viewport has no height until the slide is shown
  if(num===10) runSms();
  if(num!==16) stopFaqs();
  if(num===11) runCrm();
  if(num===23) runAi();
  if(num===21) runTotal();
}
function restagger(sl){
  sl.querySelectorAll(".rv,.rx").forEach(function(el){
    var d=el.style.animationDelay; el.style.animation="none"; void el.offsetWidth; el.style.animation=""; el.style.animationDelay=d;
  });
}
document.getElementById("prev").onclick=function(){show(i-1);};
document.getElementById("next").onclick=function(){show(i+1);};
pos.onclick=function(){grid.classList.toggle("on");};
/* Click anywhere on the slide to advance — but never swallow a click meant
   for the live demos (phone survey, CRM board, calculator sliders, nav). */
document.getElementById("fit").addEventListener("click",function(e){
  if(e.target.closest("button,input,select,textarea,a,.phone,.crm,.calcdev,.faqgrid,#nav,#grid")) return;
  if(SLIDES[i].n===19) return;   // calculator slide: arrow key or the nav button only
  show(i+1);
});
grid.onclick=function(e){var c=e.target.closest(".gcard"); if(c){grid.classList.remove("on");show(+c.dataset.i);} else if(e.target===grid) grid.classList.remove("on");};
window.addEventListener("keydown",function(e){
  var t=e.target; if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)) return;
  var k=e.key;
  if(k==="ArrowRight"||k==="Right"||k==="PageDown"||k===" "){show(i+1);e.preventDefault();}
  else if(k==="ArrowLeft"||k==="Left"||k==="PageUp") show(i-1);
  else if(k==="o"||k==="O") grid.classList.toggle("on");
  else if(k==="Escape") grid.classList.remove("on");
  else if(k==="f"||k==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
});

/* ---- slide 8 life ---- */
function tick(el,step,fmt){
  if(!el)return; var n=parseFloat(el.dataset.n||"0");
  setInterval(function(){n+=step;el.dataset.n=n;el.textContent=fmt(n);
    el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");},3200+Math.floor(Math.random()*2600));
}
var fbL=document.getElementById("fb-likes");fbL.dataset.n="5834";tick(fbL,3,function(n){return (n/1000).toFixed(1)+"K";});
var fbC=document.getElementById("fb-comments");fbC.dataset.n="461";tick(fbC,1,function(n){return String(Math.round(n));});
var igL=document.getElementById("ig-likes");igL.dataset.n="1431";tick(igL,2,function(n){return Math.round(n).toLocaleString();});

function chatPlay(body,script,timers,stamp){
  timers.forEach(clearTimeout);timers.length=0;
  body.innerHTML='<div class="ios-stamp">'+stamp+'</div>';
  function trim(){while(body.scrollHeight>body.clientHeight&&body.children.length>1) body.removeChild(body.children[0]);}
  var at=700;
  script.forEach(function(m){
    if(m.fn){timers.push(setTimeout(function(){m.fn(body);trim();},at));at+=(m.gap||900);return;}
    var wait=m.wait||(m.o?1250:950);
    timers.push(setTimeout(function(){
      var t=document.createElement("div");t.className="ios-row in"+(m.o?" out":"")+(m.me?" me":"");t.setAttribute("data-typing","1");
      t.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';body.appendChild(t);trim();
    },at));
    timers.push(setTimeout(function(){
      var t=body.querySelector("[data-typing]");if(t)t.remove();
      var d=document.createElement("div");d.className="ios-row in"+(m.o?" out":"")+(m.cls?" "+m.cls:"");
      d.innerHTML=(m.who?'<span class="who">'+m.who+'</span>':'')+'<div class="ios-bub">'+m.t+'</div>';body.appendChild(d);trim();
    },at+wait));
    at+=wait+(m.hold||(m.t.length>90?2700:1500));
  });
}
