<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PMU Bookings On Demand</title>
<link rel="icon" type="image/png" href="/deck/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --teal:#2EC4C6; --teal-dark:#1FA6A8; --teal-soft:#E8F9F9;
  --ink:#171717; --muted:#5b6470; --line:#e6e9ee;
  /* the iPhone system stack — what a real Messages screenshot looks like */
  --ios:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0d1114;color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
/* Slide 7 sets the house style: Inter bold for headings, Poppins for body. */
h1,h2,h3,.disp{font-family:Inter,sans-serif;letter-spacing:-.02em}

/* ---------- fixed 1600x900 stage, scaled to fit ---------- */
#fit{position:fixed;inset:0;overflow:hidden}
/* Absolute + translate, not grid centering: a grid clamps an oversized
   child to the start edge, which pushes the scaled stage off to the right. */
#stage{width:1600px;height:900px;position:absolute;left:50%;top:50%;
  transform-origin:center center;background:#fff;box-shadow:0 0 60px -10px rgba(0,0,0,.6)}
.slide{position:absolute;inset:0;display:none;background:#fff}
.slide.on{display:block}
.slide > .inner{position:absolute;inset:0;padding:52px 70px;display:flex;flex-direction:column}
img.full{width:100%;height:100%;object-fit:cover;display:block}

.brush{position:absolute;top:-34px;left:-64px;width:390px;pointer-events:none;z-index:0}
.logo{position:absolute;top:30px;right:40px;height:52px;z-index:4;opacity:.95}
.slide-no{position:absolute;bottom:20px;left:70px;font-size:11px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:#aab3bd;z-index:6}
.slide-no .lv{color:#ff4d4f}
.slide.dark .slide-no{color:#6d7a84}

.row{position:relative;z-index:2;flex:1;display:flex;gap:56px;align-items:center;min-height:0}
.col-copy{flex:1 1 44%;min-width:0}
.col-visual{flex:1 1 56%;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;gap:30px}

h1.title{font-family:Inter,sans-serif;font-size:55px;line-height:1.1;font-weight:700;margin:0 0 24px}
p.lede{font-family:Poppins,sans-serif;font-size:29px;line-height:1.42;color:#2b3340;margin:0 0 26px;max-width:24em}
p.lede b{font-weight:700}
ul.bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:15px}
ul.bullets li{display:flex;align-items:center;gap:15px;font-family:Poppins,sans-serif;font-size:29px;font-weight:400;line-height:1.42}
.chev{flex:none;width:30px;height:30px;border-radius:50%;background:var(--teal);display:grid;place-items:center;
  color:#fff;box-shadow:0 2px 8px rgba(46,196,198,.35)}
.chev svg{width:52%;height:52%}
.rv{opacity:0;transform:translateY(12px)}
.slide.on .rv{animation:rise .55s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.rx{opacity:0;transform:translateX(-14px)}
.slide.on .rx{animation:sx .5s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes sx{to{opacity:1;transform:none}}

/* ---------- phones ---------- */
.phone{position:relative;background:#0d0f12;border-radius:36px;padding:9px;flex:none;
  box-shadow:0 26px 60px -18px rgba(13,15,18,.55),0 0 0 1px rgba(0,0,0,.06)}
.phone .screen{position:relative;background:#fff;border-radius:28px;overflow:hidden;width:100%;height:100%;
  display:flex;flex-direction:column}
.notch{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:33%;height:20px;background:#0d0f12;
  border-radius:0 0 13px 13px;z-index:8}
.statusbar{flex:none;display:flex;justify-content:space-between;align-items:center;padding:8px 15px 3px;
  font-size:10px;font-weight:700;color:#111}
.live{position:absolute;z-index:9;top:12px;left:12px;display:flex;align-items:center;gap:6px;
  background:rgba(17,17,17,.72);color:#fff;border-radius:999px;padding:4px 9px 4px 7px;font-size:9px;
  font-weight:700;letter-spacing:.1em;backdrop-filter:blur(4px)}
.live i{width:6px;height:6px;border-radius:50%;background:#ff4d4f;animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* --- facebook --- */
.ph-fb{width:330px;height:620px}
.fb-chrome{flex:none;padding:0 13px 8px;border-bottom:1px solid #e9ebee}
.fb-top{display:flex;align-items:center;justify-content:space-between}
.fb-word{font-family:Poppins;font-weight:800;color:#0866FF;font-size:18px;letter-spacing:-.03em}
.fb-ic{width:20px;height:20px;border-radius:50%;background:#eef0f3;display:inline-grid;place-items:center;margin-left:6px}
.fb-ic svg{width:58%;height:58%}
.fb-search{margin-top:7px;background:#eef0f3;border-radius:999px;padding:5px 12px;font-size:10px;color:#8a8d91}
.fb-tabs{display:flex;justify-content:space-between;padding:7px 6px 0;color:#8a8d91}
.fb-tabs svg{width:19px;height:19px}
.fb-tabs .act{color:#0866FF}
.post{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.post-head{display:flex;align-items:center;gap:8px;padding:10px 13px 7px}
.avatar{flex:none;width:30px;height:30px;border-radius:50%;overflow:hidden;background:#f2f2f4;display:grid;place-items:center}
.avatar img{width:100%;height:100%;object-fit:cover}
.post-who{min-width:0;flex:1}
.post-name{font-size:12px;font-weight:700;color:#050505;line-height:1.2}
.post-meta{font-size:10px;color:#65676b;display:flex;align-items:center;gap:4px}
.post-more{color:#65676b;font-weight:700;letter-spacing:1px;font-size:13px}
.post-copy{padding:0 13px 8px;font-size:11.5px;line-height:1.38;color:#050505}
.post-copy .more{color:#65676b}
.media{position:relative;flex:1 1 auto;min-height:46%;background:#000}
.media video{width:100%;height:100%;object-fit:cover;display:block}
.fly-wrap{position:absolute;right:10px;bottom:8px;width:64px;height:78%;pointer-events:none;z-index:6}
.fly{position:absolute;bottom:0;width:26px;height:26px;color:#F3425F;opacity:0;will-change:transform,opacity}
.fly svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
@keyframes floatup{
  0%{opacity:0;transform:translate(0,0) scale(.45)}
  14%{opacity:1;transform:translate(var(--dx1),-18px) scale(1.12)}
  34%{transform:translate(var(--dx2),-52px) scale(1)}
  100%{opacity:0;transform:translate(var(--dx3),-165px) scale(.85)}
}
/* Reduced motion: keep the reaction, drop the travel. */
@keyframes fadeheart{0%{opacity:0}25%{opacity:.95}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.fly{animation-name:fadeheart!important}}
.cta-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:7px;background:#f0f2f5;padding:9px 11px}
/* must stay on one line inside the phone */
.cta-bar .hl{display:block;font-size:12.5px;font-weight:800;color:#050505;line-height:1.25;white-space:nowrap}
.cta-bar .sb{display:block;font-size:10.5px;color:#65676b;margin-top:1px}
.cta-btn{flex:none;background:#e4e6eb;border-radius:6px;font-weight:700;color:#050505;padding:6px 10px;font-size:10px;white-space:nowrap}
.stats{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 13px 6px;
  font-size:12px;color:#65676b;border-bottom:1px solid #e9ebee}
.reacts{display:flex;align-items:center;gap:0}
.rbubble{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;flex:none}
.rbubble svg{width:11px;height:11px;color:#fff}
.rbubble.like{background:linear-gradient(180deg,#3b8cff,#0866FF);z-index:2}
.rbubble.love{background:linear-gradient(180deg,#ff5f7a,#F3425F);margin-left:-6px;z-index:1}
.rcount{margin-left:7px;color:#65676b}
.actions{flex:none;display:flex;justify-content:space-around;padding:7px 0 10px;font-size:11.5px;font-weight:600;color:#65676b}
.actions span{display:flex;align-items:center;gap:5px}
.actions svg{width:14px;height:14px}
.bump{display:inline-block;animation:bump .45s ease-out}
@keyframes bump{0%{transform:translateY(0)}40%{transform:translateY(-3px)}100%{transform:translateY(0)}}

/* --- instagram reel --- */
.ph-ig{width:282px;height:560px;margin-top:40px}
.ig-screen{background:#000}
.ig-reel{position:relative;flex:1;min-height:0;overflow:hidden}
.ig-reel video{width:100%;height:100%;object-fit:cover;display:block}
.ig-shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 46%,rgba(0,0,0,.78) 100%)}
.ig-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
  padding:30px 13px 0;color:#fff;z-index:3}
.ig-top .ttl{font-family:Poppins;font-weight:700;font-size:15px}
.ig-top svg{width:18px;height:18px}
.ig-side{position:absolute;right:9px;bottom:88px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:15px;color:#fff}
.ig-side .it{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:600;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.ig-side svg{width:22px;height:22px}
.ig-disc{width:24px;height:24px;border-radius:6px;overflow:hidden;border:1.5px solid #fff;animation:spin 6s linear infinite}
.ig-disc img{width:100%;height:100%;object-fit:cover}
@keyframes spin{to{transform:rotate(360deg)}}
.ig-bot{position:absolute;left:0;right:52px;bottom:0;z-index:3;color:#fff;padding:0 13px 11px;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.55))}
.ig-user{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.ig-ring{width:26px;height:26px;border-radius:50%;padding:1.5px;
  background:conic-gradient(from 20deg,#f9ce34,#ee2a7b,#6228d7,#f9ce34);flex:none}
.ig-ring i{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;border:1.5px solid #000;background:#fff}
.ig-ring img{width:100%;height:100%;object-fit:cover;display:block}
.ig-user .n{font-size:12px;font-weight:700}
.ig-follow{border:1px solid rgba(255,255,255,.9);border-radius:6px;padding:2px 9px;font-size:10px;font-weight:600}
.ig-cap{font-size:11.5px;line-height:1.35}
.ig-spon{font-size:9.5px;opacity:.92;margin-top:3px;font-weight:600}
.ig-audio{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:9.5px;font-weight:500;overflow:hidden;white-space:nowrap}
.ig-audio svg{width:11px;height:11px;flex:none}
.ig-audio span{display:inline-block;animation:marq 11s linear infinite}
@keyframes marq{0%{transform:translateX(0)}100%{transform:translateX(-52%)}}
.ig-cta{margin-top:8px;background:rgba(255,255,255,.95);color:#111;border-radius:9px;padding:9px;text-align:center;
  font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.ig-cta svg{width:12px;height:12px}
.ig-heart{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#fff;opacity:0;z-index:4}
.ig-heart svg{width:32%;height:32%;filter:drop-shadow(0 4px 14px rgba(0,0,0,.45))}
.ig-heart.pop{animation:hp 1.1s ease-out}
@keyframes hp{0%{opacity:0;transform:scale(.4)}22%{opacity:1;transform:scale(1.12)}40%{transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.ig-prog{position:absolute;left:0;bottom:0;height:2px;background:#fff;z-index:5;width:0;opacity:.9}
/* keep the badge clear of the "Reels" title row */
.ph-ig .live{top:58px}

/* ---------- slide 9: the real funnel survey ---------- */
.ph-survey{width:392px;height:790px}
.ph-survey .notch{display:none}
.fnl{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;font-family:Inter,sans-serif}
.fnl-bar{flex:none;background:var(--teal);color:#fff;text-align:center;font-size:12.5px;font-weight:500;padding:7px}
.fnl-tel{flex:none;text-align:center;font-size:15px;font-weight:700;color:#111;padding:6px;border-bottom:1px solid #eef0f2}
.fnl-brand{flex:none;text-align:center;padding:8px 0 4px}
.fnl-brand img{width:58px;height:58px;border-radius:50%;object-fit:cover;display:inline-block}
.fnl-trust{font-size:12px;color:#6b747f;margin-top:3px}
.fnl-stars{color:#f5a623;font-size:13.5px;letter-spacing:1.5px}
.fnl-cong{flex:none;text-align:center;font-size:15px;color:#111;line-height:1.35;padding:4px 22px 0}
.fnl-h{flex:none;text-align:center;font-family:Poppins;font-weight:700;font-size:23px;line-height:1.2;padding:6px 20px 0}
.fnl-sec{flex:none;text-align:center;font-size:13.5px;color:#6b747f;padding:2px 0 7px}
/* hugs its content, like the real page — not stretched to the phone height */
.fnl-card{flex:0 0 auto;margin:0 16px 16px;background:#fff;border-radius:12px;
  box-shadow:0 3px 18px rgba(20,25,35,.14);padding:18px 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
/* One question at a time, like the real funnel — so it can breathe. */
.fq .fl{font-size:17.5px;font-weight:600;color:#2b3340;margin-bottom:11px;line-height:1.3}
.fq .fl i{color:#e05252;font-style:normal}
.fopts{display:flex;flex-direction:column;gap:8px}
.fopt{display:flex;align-items:center;gap:10px;border:1px solid #e7eaee;background:#fbfcfd;border-radius:9px;
  padding:13px 15px;font-size:16px;color:#3a434f;cursor:pointer;font-family:inherit;text-align:left;transition:.12s;line-height:1.2}
.fopt:hover{border-color:var(--teal)}
.fopt i{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid #c3cad2;background:#fff;display:block}
.fopt.on{border-color:var(--teal);background:var(--teal-soft);color:#12706f;font-weight:600}
.fopt.on i{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 3px #fff}
.finput{border:1px solid #e7eaee;background:#fbfcfd;border-radius:9px;padding:14px 15px;font:inherit;font-size:16px;width:100%;color:#111}
.finput:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 2px rgba(46,196,198,.16)}
.fnext{margin-top:auto;background:#111;color:#fff;border:0;border-radius:9px;cursor:pointer;padding:14px;
  font:inherit;font-family:Poppins;font-weight:700;font-size:17px;letter-spacing:.02em}
.fprog{flex:none;display:flex;align-items:center;gap:9px;padding:0 16px 8px;font-size:12.5px;color:#8b949e;font-weight:600}
.fprog .track{flex:1;height:4px;background:#e9edf1;border-radius:999px;overflow:hidden}
.fprog .track i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .3s ease}
.fback{background:none;border:0;color:#8b949e;font:inherit;font-size:12px;cursor:pointer;padding:0;text-align:left}
.fdone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;gap:11px}
.fdone .big{font-size:46px;line-height:1}
.fdone h4{font-family:Poppins;font-weight:700;font-size:17px;margin:0}
.fdone p{margin:0;font-size:11px;color:var(--muted);line-height:1.45}
.frecap{width:100%;text-align:left;background:#f7fafb;border:1px solid #e4edee;border-radius:10px;padding:11px;
  font-size:10.5px;line-height:1.6;color:#33404b}
.frecap b{color:#111}
.fsand{display:inline-flex;align-items:center;gap:6px;background:#fff6e0;border:1px solid #ffe2a8;color:#8a6100;
  border-radius:999px;padding:5px 12px;font-size:10px;font-weight:700}
.sandbox-pill{display:inline-flex;align-items:center;gap:8px;background:#fff6e0;border:1px solid #ffe2a8;color:#8a6100;
  border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;margin-top:20px}
.sandbox-pill svg{width:15px;height:15px;flex:none}

/* ---------- slide 10: iMessage ---------- */
.ph-sms{width:352px;height:700px}
.ios-head{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0;
  background:rgba(247,247,248,.95);border-bottom:.5px solid #d6d6da;position:relative;font-family:var(--ios)}
.ios-back{position:absolute;left:12px;top:50%;transform:translateY(-30%);color:#0a84ff;display:flex;align-items:center;gap:2px;font-size:12px}
.ios-back svg{width:13px;height:13px}
.ios-badge{background:#ff3b30;color:#fff;border-radius:999px;padding:0 6px;font-size:10px;font-weight:700}
.ios-av{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid #e3e6ea;display:grid;
  place-items:center;overflow:hidden}
/* contain, not cover — the logo is wide and was being cropped to a blur */
.ios-av img{width:76%;height:76%;object-fit:contain}
.ios-name{font-size:12px;font-weight:500;color:#111;display:flex;align-items:center;gap:3px}
.ios-name svg{width:9px;height:9px;color:#9a9aa0}
.ios-body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;
  padding:12px 12px;background:#fff;font-family:var(--ios)}
.ios-stamp{text-align:center;font-size:10.5px;color:#8e8e93;margin:4px 0;font-weight:400}
.ios-stamp b{font-weight:600;color:#8e8e93}
.ios-row{display:flex;flex-direction:column;align-items:flex-start;opacity:0;transform:translateY(12px) scale(.97)}
.ios-row.in{animation:bin .42s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes bin{to{opacity:1;transform:none}}
.ios-bub{position:relative;max-width:86%;background:#e9e9eb;color:#000;border-radius:19px;padding:10px 15px;
  font-size:16px;line-height:1.34;white-space:pre-line;font-family:var(--ios);letter-spacing:-.01em}
.ios-bub::before{content:"";position:absolute;left:-5px;bottom:0;width:15px;height:17px;background:#e9e9eb;
  border-bottom-right-radius:17px;z-index:-1}
.ios-bub::after{content:"";position:absolute;left:-10px;bottom:0;width:11px;height:17px;background:#fff;border-bottom-right-radius:13px}
.ios-bub .hd{font-weight:600}
.ios-read{font-size:10px;color:#8e8e93;margin:2px 0 0 6px}
.typing{display:flex;gap:4px;align-items:center;background:#e9e9eb;border-radius:18px;padding:11px 15px;width:fit-content}
.typing i{width:7px;height:7px;border-radius:50%;background:#a3a3a8;animation:td 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes td{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.ios-foot{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:.5px solid #d6d6da;
  background:rgba(247,247,248,.95);color:#a8a8ae;font-size:13px;font-family:var(--ios)}
.ios-foot .plus{width:22px;height:22px;border-radius:50%;background:#e4e4e8;display:grid;place-items:center;color:#7b7b80;flex:none}
.ios-foot .inp{flex:1;background:#fff;border:.5px solid #d6d6da;border-radius:999px;padding:6px 12px}

/* ---------- slide 11: CRM ---------- */
.crm{width:100%;height:100%;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);
  border-radius:14px;overflow:hidden;box-shadow:0 20px 46px -22px rgba(20,25,35,.35)}
.crm-top{flex:none;display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:#5b6470}
.crm-top .pill{background:var(--teal-soft);color:var(--teal-dark);font-weight:700;border-radius:999px;padding:3px 11px}
.crm-cols{flex:1;min-height:0;display:flex;gap:9px;padding:10px;background:#f7f9fb}
.crm-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;border-radius:9px;padding:4px;transition:.15s}
.crm-col.over{background:var(--teal-soft);outline:2px dashed var(--teal)}
.crm-h{font-size:18px;font-weight:700;color:#1b2228;display:flex;justify-content:space-between;align-items:center;
  gap:6px;padding:3px 3px 7px;border-bottom:2px solid var(--teal)}
.crm-h em{font-style:normal;color:#98a1ab;font-weight:600;font-size:14px}
.crm-card{background:#fff;border:1px solid #e8ecf1;border-radius:9px;padding:9px 10px;box-shadow:0 1px 2px rgba(20,25,35,.05);cursor:grab}
.crm-card.drag{opacity:.4}
.crm-card b{display:block;color:#111;font-weight:600;font-size:13px;line-height:1.3}

/* scale the 1600x900 stage to whatever screen it is shown on */
function fit(){
  var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
  stage.style.transform="translate(-50%,-50%) scale("+s+")";
}
window.addEventListener("resize",fit); fit();

var pos=document.getElementById("pos"),bar=document.getElementById("bar"),grid=document.getElementById("grid"),i=0;
function show(n){
  i=Math.max(0,Math.min(nodes.length-1,n));
  nodes.forEach(function(s,k){s.classList.toggle("on",k===i);});
  pos.textContent=(i+1)+" / "+nodes.length;
  bar.style.width=((i+1)/nodes.length*100)+"%";
  [].forEach.call(grid.querySelectorAll(".gcard"),function(c,k){c.classList.toggle("cur",k===i);});
  restagger(nodes[i]);
  nodes[i].querySelectorAll("video[autoplay]").forEach(function(v){v.play().catch(function(){});});
  var num=SLIDES[i].n;
  if(num===10) runSms();
  if(num!==16) stopFaqs();
  if(num===11) runCrm();
  if(num===19) resetCalc();
}
function restagger(sl){
  sl.querySelectorAll(".rv,.rx").forEach(function(el){
    var d=el.style.animationDelay; el.style.animation="none"; void el.offsetWidth; el.style.animation=""; el.style.animationDelay=d;
  });
}
document.getElementById("prev").onclick=function(){show(i-1);};
document.getElementById("next").onclick=function(){show(i+1);};
pos.onclick=function(){grid.classList.toggle("on");};
/* Click anywhere on the slide to advance — but never swallow a click meant
   for the live demos (phone survey, CRM board, calculator sliders, nav). */
document.getElementById("fit").addEventListener("click",function(e){
  if(e.target.closest("button,input,select,textarea,a,.phone,.crm,.calcdev,.faqgrid,#nav,#grid")) return;
  if(SLIDES[i].n===19) return;   // calculator slide: arrow key or the nav button only
  show(i+1);
});
grid.onclick=function(e){var c=e.target.closest(".gcard"); if(c){grid.classList.remove("on");show(+c.dataset.i);} else if(e.target===grid) grid.classList.remove("on");};
window.addEventListener("keydown",function(e){
  var t=e.target; if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)) return;
  var k=e.key;
  if(k==="ArrowRight"||k==="Right"||k==="PageDown"||k===" "){show(i+1);e.preventDefault();}
  else if(k==="ArrowLeft"||k==="Left"||k==="PageUp") show(i-1);
  else if(k==="o"||k==="O") grid.classList.toggle("on");
  else if(k==="Escape") grid.classList.remove("on");
  else if(k==="f"||k==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
});

function tick(el,step,fmt){
  if(!el)return; var n=parseFloat(el.dataset.n||"0");
  setInterval(function(){n+=step;el.dataset.n=n;el.textContent=fmt(n);
    el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");},3200+Math.floor(Math.random()*2600));
}

/* A red heart drifts up over the Facebook ad every couple of seconds, so the

var HEARTSVG='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8.5-5.6-10.3-11A5.6 5.6 0 0 1 12 6.2 5.6 5.6 0 0 1 22.3 10C20.5 15.4 12 21 12 21Z"/></svg>';
var flyWrap=document.getElementById("fb-fly");
function flyHeart(){
  if(!flyWrap || !flyWrap.closest(".slide").classList.contains("on")) return;
  var h=document.createElement("span");
  h.className="fly";
  var dur=2.4+Math.random()*1.2, drift=(Math.random()*34-17);
  h.style.setProperty("--dx1",(drift*0.25)+"px");
  h.style.setProperty("--dx2",(drift*0.7)+"px");
  h.style.setProperty("--dx3",drift+"px");
  h.style.right=(Math.random()*22)+"px";
  h.style.width=h.style.height=(20+Math.random()*10)+"px";
  h.style.animation="floatup "+dur+"s ease-out forwards";
  h.innerHTML=HEARTSVG;
  flyWrap.appendChild(h);
  setTimeout(function(){h.remove();},dur*1000+80);
}

/* ---- slide 19: their real calculator ---- */
var CPL=6;
/* Each control is a stepper with its own increment and range. */
var FIELDS19={
  spend:{v:300,min:300,max:5000,step:150,fmt:function(n){return money(n);}},
  rate: {v:20, min:10, max:100, step:5,  fmt:function(n){return n+"%";}},
  svc:  {v:500,min:100,max:2000,step:50, fmt:function(n){return money(n);}},
  tu:   {v:150,min:0,  max:800, step:25, fmt:function(n){return money(n);}}
};
var STAGE19=0;   // 0 = only ad spend; 1 = + booking rate; 2 = + costs; 3 = + revenue
function money(n){return "$"+Math.round(n).toLocaleString();}

function calc(){
  var F=FIELDS19,
      leads=Math.round(F.spend.v/CPL),
      books=Math.round(leads*F.rate.v/100),
      refs=Math.round(books*0.15),
      total=books+refs,
      rev=total*F.svc.v+Math.round(total*0.5)*F.tu.v;
  document.getElementById("v-spend").innerHTML=money(Math.round(F.spend.v/30))+'<em>/day</em>';
  document.getElementById("v-spend-mo").textContent=money(F.spend.v)+"/mo";
  document.getElementById("v-rate").textContent=F.rate.v+"%";
  document.getElementById("v-svc").textContent=money(F.svc.v);
  document.getElementById("v-tu").textContent=money(F.tu.v);
  document.getElementById("k-leads").textContent=leads.toLocaleString();
  document.getElementById("k-book").textContent=books.toLocaleString();
  document.getElementById("k-ref").textContent=refs.toLocaleString();
  document.getElementById("k-total").textContent=total.toLocaleString();
  document.getElementById("k-rev").textContent=money(rev);
  document.getElementById("k-ret").innerHTML="on "+money(F.spend.v)+" ad spend<br><b>"+(rev/F.spend.v).toFixed(1)+"\u00d7 return</b>";
  // keep the +/- buttons honest at the ends of each range
  document.querySelectorAll(".stepper button").forEach(function(btn){
    var f=F[btn.dataset.step]; if(!f) return;
    btn.disabled = (+btn.dataset.d)<0 ? f.v<=f.min : f.v>=f.max;
  });
}

/* Nothing below the current stage is on screen — one decision at a time. */
function stage19(n){
  STAGE19=n;
  var show={ "out-leads":1,"st-rate":1,"out-book":2,"st-svc":2,"st-tu":2,"out-total":3,"c-reset":3 };
  for(var id in show){
    var el=document.getElementById(id), on=n>=show[id];
    el.classList.toggle("locked",!on);
    if(on){el.classList.remove("reveal");void el.offsetWidth;el.classList.add("reveal");}
  }
}
function resetCalc(){
  FIELDS19.spend.v=300; FIELDS19.rate.v=20; FIELDS19.svc.v=500; FIELDS19.tu.v=150;
  document.getElementById("r-rate").value=20;
  stage19(0); calc();
}
document.getElementById("r-rate").addEventListener("input",function(){
  FIELDS19.rate.v=+this.value; calc();
});
document.querySelector(".calcdev").addEventListener("click",function(e){
  var st=e.target.closest(".stepper button");
  if(st){ var f=FIELDS19[st.dataset.step];
    f.v=Math.max(f.min,Math.min(f.max,f.v+(+st.dataset.d)*f.step)); calc(); return; }
  var go=e.target.closest("[data-go]");
  if(go){ stage19(Math.max(STAGE19,+go.dataset.go)); return; }
  if(e.target.id==="c-reset") resetCalc();
});
resetCalc();

show(0); window.focus();
})();
